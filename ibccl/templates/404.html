<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 – Page Not Found | ISP Inventory</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        midnight: {
                            50: '#f8fafc',
                            100: '#f1f5f9',
                            200: '#e2e8f0',
                            300: '#cbd5e1',
                            400: '#94a3b8',
                            500: '#64748b',
                            600: '#475569',
                            700: '#334155',
                            800: '#1e293b',
                            900: '#0f172a',
                            950: '#020617',
                        }
                    },
                    fontFamily: {
                        sans: ['Public Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>

<body class="bg-gray-50 dark:bg-gray-900 min-h-screen flex items-center justify-center p-4 transition-colors duration-300">
    
    <div class="max-w-lg w-full text-center fade-in">
        <!-- Icon/Logo -->
        <div class="mb-8 flex justify-center">
            <div class="h-20 w-20 bg-indigo-100 dark:bg-indigo-900/50 rounded-2xl flex items-center justify-center shadow-inner transform rotate-12 transition-transform hover:rotate-0">
                <i class="fas fa-network-wired text-4xl text-indigo-600 dark:text-indigo-400 -rotate-12"></i>
            </div>
        </div>

        <h1 class="text-9xl font-black text-gray-200 dark:text-gray-800 tracking-tighter mb-4 select-none drop-shadow-sm">404</h1>
        
        <div class="bg-white dark:bg-gray-800 rounded-3xl shadow-2xl border border-gray-100 dark:border-gray-700 p-8 -mt-16 relative z-10 mx-4 sm:mx-0 backdrop-blur-sm">
            <h2 class="text-2xl font-bold text-gray-900 dark:text-white mb-2">Page Not Found</h2>
            <p class="text-gray-500 dark:text-gray-400 mb-6 leading-relaxed">
                The page you're looking for doesn't exist or has been moved.<br>
                <span class="text-xs font-mono bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 px-3 py-1.5 rounded-lg text-gray-600 dark:text-gray-300 mt-3 inline-block break-all shadow-inner">
                    {{ request_path }}
                </span>
            </p>
            
            <div class="flex flex-col sm:flex-row items-center justify-center gap-4 mt-2">
                <a href="/" class="w-full sm:w-auto px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl transition-all shadow-lg shadow-indigo-200 dark:shadow-none flex items-center justify-center gap-2 transform hover:-translate-y-0.5">
                    <i class="fas fa-home text-sm"></i> Go to Login
                </a>
                <a href="/dashboard" class="w-full sm:w-auto px-6 py-3 bg-white dark:bg-gray-800 hover:bg-gray-50 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-200 border-2 border-gray-200 dark:border-gray-600 font-semibold rounded-xl transition-all flex items-center justify-center gap-2 transform hover:-translate-y-0.5">
                    <i class="fas fa-tachometer-alt text-sm text-gray-400 dark:text-gray-500"></i> Dashboard
                </a>
            </div>
        </div>
        
        <div class="mt-10 text-sm font-medium text-gray-400 dark:text-gray-600">
            &copy; <script>document.write(new Date().getFullYear())</script> ISP Inventory System
        </div>
    </div>

    <style>
        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>

    <!-- Automatically set dark mode based on theme-preference if available, else fallback to system -->
    <script>
        const storedTheme = localStorage.getItem('theme-preference');
        if (storedTheme === 'dark' || (!storedTheme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
    </script>
</body>
</html>
