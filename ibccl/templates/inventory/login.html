{% extends 'inventory/base.html' %}
{% block content %}
<div class="min-h-[80vh] flex items-center justify-center py-12 px-4 bg-transparent select-none">
    <div class="max-w-md w-full p-10 bg-white/40 dark:bg-midnight-900/40 glass-card rounded-[2.5rem] shadow-2xl border border-gray-100 dark:border-midnight-800 transform transition-all hover:scale-[1.01]">
        <div class="text-center mb-10">
            <div class="mx-auto h-20 w-20 bg-indigo-600 dark:bg-indigo-500 rounded-3xl flex items-center justify-center shadow-lg shadow-indigo-200 dark:shadow-indigo-900/40 rotate-12 hover:rotate-0 transition-transform duration-500">
                <i class="fas fa-network-wired text-white text-3xl"></i>
            </div>
            <h2 class="mt-8 text-3xl font-extrabold text-gray-900 dark:text-white tracking-tight">ISP Inventory</h2>
            <p class="mt-3 text-sm font-bold text-gray-500 dark:text-gray-500 uppercase tracking-widest">Sign in to continue</p>
        </div>

        <form method="post" class="space-y-8">
            {% csrf_token %}
            <div class="space-y-6">
                <div>
                    <label class="block text-xs font-black text-gray-900 dark:text-gray-700 uppercase tracking-widest ml-1 mb-2">Username</label>
                    <input name="username" type="text" required autocomplete="username"
                           class="block w-full px-4 py-3.5 bg-gray-50/50 dark:bg-midnight-950/50 border-2 border-transparent focus:border-indigo-500 dark:focus:border-indigo-500 rounded-xl focus:ring-0 transition-all dark:text-white placeholder:text-gray-600 dark:placeholder:text-gray-600 font-medium"
                           placeholder="Enter your username">
                </div>
                <div>
                    <label class="block text-xs font-black text-gray-900 dark:text-gray-700 uppercase tracking-widest ml-1 mb-2">Password</label>
                    <div class="relative group">
                        <input id="password-input" name="password" type="password" required autocomplete="current-password"
                               class="block w-full px-4 py-3.5 bg-gray-50/50 dark:bg-midnight-950/50 border-2 border-transparent focus:border-indigo-500 dark:focus:border-indigo-500 rounded-xl focus:ring-0 transition-all dark:text-white placeholder:text-gray-600 dark:placeholder:text-gray-600 pr-14 font-medium"
                               placeholder="Enter your password">
                        <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 flex items-center pr-5 group-hover:scale-110 transition-transform">
                            <i id="toggle-icon" class="fas fa-eye text-gray-400 dark:text-gray-500 hover:text-indigo-600 transition-colors"></i>
                        </button>
                    </div>
                </div>
            </div>
            <button type="submit" class="w-full flex justify-center items-center py-3.5 px-6 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-700 hover:to-violet-700 text-white rounded-xl font-bold text-base tracking-wide transition-all shadow-lg shadow-indigo-200 dark:shadow-indigo-900/40 active:scale-[0.98] group">
                <i class="fas fa-sign-in-alt mr-2.5 group-hover:translate-x-0.5 transition-transform"></i> Sign In
            </button>
        </form>

        {% if messages %}
            {% for message in messages %}
                <script>showToast("{{ message }}", "error");</script>
            {% endfor %}
        {% endif %}

        <!-- NOC Login Link -->
        <div class="mt-6 pt-6 border-t border-gray-200 dark:border-gray-700 text-center">
            <p class="text-sm text-gray-600 dark:text-gray-400">
                NOC Team? 
                <a href="{% url 'noc:login' %}" class="text-indigo-600 dark:text-indigo-400 hover:text-indigo-800 dark:hover:text-indigo-300 font-bold transition-colors">
                    Use NOC Login
                </a>
            </p>
        </div>

        <script>
            function togglePassword() {
                const passwordInput = document.getElementById('password-input');
                const toggleIcon = document.getElementById('toggle-icon');
                
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    toggleIcon.classList.remove('fa-eye');
                    toggleIcon.classList.add('fa-eye-slash');
                } else {
                    passwordInput.type = 'password';
                    toggleIcon.classList.remove('fa-eye-slash');
                    toggleIcon.classList.add('fa-eye');
                }
            }
        </script>
    </div>
</div>
{% endblock %}
