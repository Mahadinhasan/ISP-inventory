{% extends 'noc/base.html' %}
{% block title %}Edit Material{% endblock %}
{% block content %}
<div class="fade-in max-w-2xl mx-auto">
    <div class="mb-8">
        <a href="{% url 'noc:materials' %}" class="text-indigo-600 hover:text-indigo-800 flex items-center mb-4 transition">
            <i class="fas fa-arrow-left mr-2"></i> Back to Materials
        </a>
        <h1 class="text-3xl font-bold text-gray-900 dark:text-white">Edit Material: {{ material.name }}</h1>
    </div>

    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-xl overflow-hidden p-8">
        <form method="POST" class="space-y-6">
            {% csrf_token %}
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Material Name (Read-only)</label>
                    <input type="text" value="{{ material.name }}" disabled class="w-full px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 dark:bg-gray-600 dark:text-gray-300 focus:ring-2 focus:ring-indigo-500 transition cursor-not-allowed opacity-60">
                    <p class="text-[10px] text-gray-500 dark:text-gray-400 mt-1 italic">Note: Name cannot be changed.</p>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Quantity</label>
                    <input type="number" name="quantity" value="{{ material.quantity }}" required class="w-full px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white focus:ring-2 focus:ring-indigo-500 transition">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Rate</label>
                    <input type="number" step="any" min="0" name="rate" value="{{ material.rate }}" required class="w-full px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white focus:ring-2 focus:ring-indigo-500 transition">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Min Stock Level</label>
                    <input type="number" name="min_stock_level" value="{{ material.min_stock_level }}" required class="w-full px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white focus:ring-2 focus:ring-indigo-500 transition">
                </div>
            </div>

            <div class="pt-4">
                <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-lg font-bold hover:bg-indigo-700 shadow-lg transform transition active:scale-95">
                    <i class="fas fa-save mr-2"></i> Update Material
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
