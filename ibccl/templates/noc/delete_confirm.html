{% extends 'noc/base.html' %}
{% block title %}Delete Material{% endblock %}
{% block content %}
<div class="fade-in max-w-lg mx-auto mt-10">
    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-2xl overflow-hidden p-8 text-center border-t-4 border-red-500">
        <div class="w-20 h-20 bg-red-100 dark:bg-red-900 rounded-full flex items-center justify-center mx-auto mb-6">
            <i class="fas fa-exclamation-triangle text-3xl text-red-600 dark:text-red-400"></i>
        </div>
        <h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-4">Confirm Deletion</h1>
        <p class="text-gray-600 dark:text-gray-400 mb-8">
            Are you sure you want to delete <span class="font-bold text-gray-900 dark:text-white">"{{ material.name }}"</span>? This action cannot be undone.
        </p>
        
        <form method="POST" class="flex flex-col space-y-3">
            {% csrf_token %}
            <button type="submit" class="w-full bg-red-600 text-white py-3 rounded-lg font-bold hover:bg-red-700 shadow-lg transform transition active:scale-95">
                Yes, Delete Material
            </button>
            <a href="{% url 'noc_materials' %}" class="w-full bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300 py-3 rounded-lg font-bold hover:bg-gray-200 dark:hover:bg-gray-600 transition text-center">
                Cancel
            </a>
        </form>
    </div>
</div>
{% endblock %}
