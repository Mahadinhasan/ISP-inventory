##############################################################
# ISP Inventory Management System - Nginx Configuration
# VPS IP  : 72.61.148.231
# Port    : 8080  (public-facing custom port)
# Daphne  : 127.0.0.1:8001 (internal ASGI server)
##############################################################

server {
    # Listen on custom port 8080
    listen 8080;
    server_name 72.61.148.231;

    client_max_body_size 50M;

    # ── Static files (collected by: python manage.py collectstatic) ──
    location /static/ {
        alias /var/www/isp-inventory/ibccl/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── Media files (user uploads: profile images, backups, etc.) ──
    location /media/ {
        alias /var/www/isp-inventory/ibccl/media/;
        expires 7d;
    }

    # ── WebSocket connections → Daphne ──
    location /ws/ {
        proxy_pass http://127.0.0.1:8001;

        # WebSocket upgrade headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # ── All other HTTP requests → Daphne ──
    location / {
        proxy_pass http://127.0.0.1:8001;

        proxy_http_version 1.1;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }
}
